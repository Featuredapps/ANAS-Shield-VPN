plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.anas.shieldvpn'
    compileSdk 35
    defaultConfig {
        applicationId 'com.anas.shieldvpn'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    buildFeatures { buildConfig true }
}
dependencies {
    implementation 'com.wireguard.android:tunnel:1.0.20230706'
}
